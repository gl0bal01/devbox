# HTTPS overlay for Traefik: port 443 on the Tailscale IP (never 0.0.0.0),
# OVH DNS-01 credentials and ACME storage. Chained via COMPOSE_FILE in ./.env
# when ENABLE_HTTPS=true. acme.json lives in a named volume that Traefik owns
# (it insists on mode 0600 for its own uid); backup.sh archives it.

services:
  traefik:
    env_file: ovh.env   # OVH_ENDPOINT / OVH_APPLICATION_KEY / OVH_APPLICATION_SECRET / OVH_CONSUMER_KEY
    ports:
      - "${TAILSCALE_IP:?TAILSCALE_IP unset}:443:443"
    volumes:
      - letsencrypt:/letsencrypt

volumes:
  letsencrypt:
