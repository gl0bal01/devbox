# Defense in depth behind the Tailscale-only port binds.
http:
  middlewares:
    internal-only:
      ipAllowList:
        sourceRange:
          - "100.64.0.0/10"        # Tailscale IPv4 CGNAT
          - "fd7a:115c:a1e0::/48"  # Tailscale IPv6 ULA
          - "127.0.0.1/32"         # in-container health checks
          - "::1/128"
