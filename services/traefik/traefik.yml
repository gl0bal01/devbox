# Traefik static config — HTTP mode. In HTTPS mode setup.sh replaces this
# file with the rendered traefik.https.yml.template.
#
# Every entrypoint applies the security headers and the Tailscale-only
# allowlist, so a new router is covered without per-router labels. Logs go
# to stdout; the Docker daemon rotates them (see /etc/docker/daemon.json).

global:
  checkNewVersion: false   # versions are pinned by tag + digest lock
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"
    http:
      middlewares:
        - default-headers-base@file
        - internal-only@file

providers:
  docker:
    endpoint: "tcp://docker-socket-proxy:2375"
    exposedByDefault: false
    network: proxy-net
  file:
    directory: /etc/traefik/dynamic
    watch: true

api:
  dashboard: true
  insecure: false

ping: {}

log:
  level: INFO

accessLog: {}
