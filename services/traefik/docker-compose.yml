# Traefik reverse proxy + docker-socket-proxy (HTTP mode, Tailscale-bound).
#
# setup.sh writes COMPOSE_FILE and TAILSCALE_IP into ./.env, so a plain
# `docker compose <cmd>` in this directory always loads the full chain:
# this file, docker-compose.https.yml in HTTPS mode, then the digest lock.
#
# Do not edit image digests by hand: bump the tag here, then run
# scripts/update-images.sh --apply. Log rotation comes from the Docker daemon
# defaults that setup.sh writes to /etc/docker/daemon.json.

name: traefik

services:
  # Exposes a read-only subset of the Docker API so Traefik never touches
  # /var/run/docker.sock directly.
  docker-socket-proxy:
    # upstream ships no minor tag; patch-pinned (bump manually)
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: docker-socket-proxy
    restart: unless-stopped
    stop_grace_period: 10s
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      SERVICES: 1
      TASKS: 1
      POST: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EXEC: 0
      IMAGES: 0
      INFO: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SWARM: 0
      SYSTEM: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # read_only is not possible: HAProxy renders its config from a template
    # at start. cap_drop, no-new-privileges, the :ro socket and the env
    # allowlist above carry the hardening.
    tmpfs:
      - /run
      - /tmp
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 50
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    # Root without capabilities cannot read other users' files: join the
    # operator's group to read the 0640 basic-auth middlewares in ./dynamic.
    group_add:
      - "${DEVBOX_GID:?DEVBOX_GID unset - see ./.env}"
    ports:
      # Fails closed: an unset TAILSCALE_IP must never become a 0.0.0.0 bind.
      - "${TAILSCALE_IP:?TAILSCALE_IP unset - run docker compose from ~/docker/traefik (its .env sets it)}:80:80"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
    networks:
      - proxy-net
      - socket-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.internal`)"
      - "traefik.http.routers.traefik.entrypoints=web"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=dashboard-auth@file"
      # Set by setup.sh: recreates the container when traefik.yml changes.
      - "devbox.config-hash=${TRAEFIK_CONFIG_HASH:-}"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 100

networks:
  proxy-net:
    external: true
  socket-proxy:
    driver: bridge
    internal: true
