# NVIDIA GPU overlay for Ollama. Chained via COMPOSE_FILE in ./.env when
# setup.sh runs with DEVBOX_GPU=nvidia. Requires the NVIDIA driver and the
# NVIDIA Container Toolkit on the host (setup.sh checks `docker info`).

services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
