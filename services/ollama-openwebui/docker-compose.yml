# Ollama + Open WebUI (HTTP mode). Reached only through Traefik on the
# Tailscale IP; neither container publishes a host port.
#
# setup.sh writes COMPOSE_FILE (base [+ https] [+ gpu] + lock) into ./.env, so
# a plain `docker compose <cmd>` here always loads the full chain. Tunables
# (OLLAMA_MEM_LIMIT, OLLAMA_CPUS, OLLAMA_* runtime env) also live in ./.env.
#
# Ollama is routed at Host(`ollama.internal`) behind basic auth
# (ollama-auth@file). Open WebUI reaches it directly at http://ollama:11434 on
# proxy-net, without crossing Traefik.

name: ollama-openwebui

services:
  ollama:
    # upstream ships no minor tag; patch-pinned (bump manually)
    image: ollama/ollama:0.40.10
    container_name: ollama
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SYS_RESOURCE
    environment:
      # Empty means "use Ollama's default"; set in ./.env to tune.
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-}"
      OLLAMA_NUM_PARALLEL: "${OLLAMA_NUM_PARALLEL:-}"
      OLLAMA_MAX_LOADED_MODELS: "${OLLAMA_MAX_LOADED_MODELS:-}"
      OLLAMA_CONTEXT_LENGTH: "${OLLAMA_CONTEXT_LENGTH:-}"
    expose:
      - "11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - proxy-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ollama.rule=Host(`ollama.internal`)"
      - "traefik.http.routers.ollama.entrypoints=web"
      - "traefik.http.routers.ollama.service=ollama"
      - "traefik.http.routers.ollama.middlewares=ollama-auth@file"
      - "traefik.http.services.ollama.loadbalancer.server.port=11434"
    # Size to the largest model you run; setup.sh caps OLLAMA_CPUS at nproc.
    mem_limit: ${OLLAMA_MEM_LIMIT:-8g}
    memswap_limit: ${OLLAMA_MEM_LIMIT:-8g}
    cpus: ${OLLAMA_CPUS:-2}
    pids_limit: 200
    healthcheck:
      # The image ships no curl/wget; `ollama list` exits 0 once the API is up.
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  openwebui:
    image: ghcr.io/open-webui/open-webui:0.12
    container_name: openwebui
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: "http://ollama:11434"
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY unset - see ./.env}"
      ENABLE_SIGNUP: "${ENABLE_SIGNUP:-false}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - openwebui-data:/app/backend/data
    networks:
      - proxy-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openwebui.rule=Host(`ai.internal`)"
      - "traefik.http.routers.openwebui.entrypoints=web"
      - "traefik.http.routers.openwebui.service=openwebui"
      - "traefik.http.services.openwebui.loadbalancer.server.port=8080"
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  ollama-data:
  openwebui-data:

networks:
  proxy-net:
    external: true
