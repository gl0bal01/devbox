name: monthly-rebuild
on:
  schedule:
    - cron: '0 6 1 * *'   # 1st of the month, 06:00 UTC
  workflow_dispatch:

concurrency:
  group: monthly-rebuild
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Refresh image digests and pins, smoke-test them, open one PR. Never
  # pushes to main. PRs opened with GITHUB_TOKEN do not trigger pr-validate:
  # close and reopen the PR (or push to it) to run the full suite.
  refresh:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Docker Hub login (skipped without secrets)
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Refresh digest locks
        run: scripts/update-images.sh --apply
      - name: Refresh pins (fails on vendor key rotation)
        run: scripts/update-pins.sh --apply
      - name: Smoke-test refreshed locks
        run: scripts/ci/smoke-test.sh
      - name: Describe changes
        run: |
          {
            echo 'Automated monthly refresh: image digests within the pinned tags, and the Oh My Zsh pin.'
            echo
            echo '```diff'
            git diff -- services/*/docker-compose.lock.yml scripts/lib/pins.sh | grep -E '^[+-] *(image:|OHMYZSH)' || echo '(no changes)'
            echo '```'
            echo
            echo 'Smoke test passed on the runner. Re-run pr-validate (close/reopen) before merging.'
          } > "${RUNNER_TEMP}/body.md"
      - name: Open PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/monthly-refresh
          base: main
          title: 'chore: monthly image digest and pin refresh'
          commit-message: 'chore: refresh image digests and pins'
          body-path: ${{ runner.temp }}/body.md
          delete-branch: true

  # Release main as a signed tarball. Skipped when main has not moved since
  # the previous monthly tag; refused unless pr-validate passed on that commit.
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read     # read pr-validate results
      id-token: write   # cosign keyless (GitHub OIDC -> Fulcio)
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Skip when main is unchanged
        id: prev
        run: |
          prev=$(git tag -l 'monthly-*' --sort=-creatordate | head -n1)
          echo "tag=${prev}" >> "$GITHUB_OUTPUT"
          if [ -n "${prev}" ] && [ "$(git rev-parse "${prev}^{commit}")" = "$(git rev-parse HEAD)" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Require green pr-validate on this commit
        if: steps.prev.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          result=$(gh run list --workflow pr-validate.yml --branch main --commit "${sha}" \
                     --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          [ "${result}" -gt 0 ] || { echo "pr-validate has not passed on ${sha}; not releasing." >&2; exit 1; }
      - name: Docker Hub login (skipped without secrets)
        if: ${{ steps.prev.outputs.skip != 'true' && env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Smoke-test main's locks
        if: steps.prev.outputs.skip != 'true'
        run: scripts/ci/smoke-test.sh
      - name: Build deterministic tarball
        if: steps.prev.outputs.skip != 'true'
        run: |
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
              -cf devbox.tar services scripts setup.sh Makefile ARCHITECTURE.md README.md LICENSE docs
          sha256sum devbox.tar > devbox.tar.sha256
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.prev.outputs.skip != 'true'
      - name: Sign (cosign keyless, Sigstore bundle)
        if: steps.prev.outputs.skip != 'true'
        run: cosign sign-blob --yes --bundle devbox.tar.sigstore.json devbox.tar
      - name: Publish release
        if: steps.prev.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PREV: ${{ steps.prev.outputs.tag }}
        run: |
          tag="monthly-$(date -u +%Y%m%d)"
          scripts/ci/release-notes.sh "${PREV:-$(git rev-list --max-parents=0 HEAD)}" HEAD > notes.md
          gh release create "${tag}" --target "$(git rev-parse HEAD)" --title "${tag}" --notes-file notes.md \
            devbox.tar devbox.tar.sha256 devbox.tar.sigstore.json
